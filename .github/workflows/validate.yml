name: Validate packs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON syntax
        run: |
          set -e
          for f in rules/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "OK $f"
          done
