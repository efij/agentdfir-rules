name: Sync packs from AgentDFIR
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch packs from AgentDFIR main
        run: |
          set -e
          for f in community-pack.json starter-pack.json; do
            curl -fsSL "https://raw.githubusercontent.com/efij/AgentDFIR/main/rules/$f" -o "rules/$f"
          done
          git status --short
      - name: No change → stop
        id: diff
        run: |
          if git diff --quiet -- rules/; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Packs already in sync."; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v5
        if: steps.diff.outputs.changed == 'true'
        with:
          go-version: '1.22'
      - name: Validate with the AgentDFIR loader
        if: steps.diff.outputs.changed == 'true'
        run: go run github.com/efij/AgentDFIR/cmd/agentdfir@latest rules validate ./rules
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "agentdfir-sync[bot]"
          git config user.email "agentdfir-sync@users.noreply.github.com"
          git add rules/
          git commit -m "Sync rule packs from AgentDFIR main ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
